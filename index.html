<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historium Arena</title>
<meta name="description" content="Joc de cultură generală cu întrebări, curiozități istorice și lupte în arenă. Gratuit pe iPhone și Android.">

<meta property="og:title" content="Historium Arena">
<meta property="og:description" content="Joc de cultură generală cu întrebări, curiozități istorice și lupte în arenă.">
<meta property="og:type" content="website">

<script>
(function () {
  var IOS     = "https://apps.apple.com/app/id6800425743";
  var ANDROID = "https://play.google.com/store/apps/details?id=com.quizmedieval.quiz_medieval";

  var ua = navigator.userAgent || "";
  var iOS = /iPad|iPhone|iPod/.test(ua) ||
            (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var android = /Android/.test(ua);

  if (iOS)          location.replace(IOS);
  else if (android) location.replace(ANDROID);
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

<style>
  :root{
    --stone:#140a05;
    --umber:#2e150a;
    --rust:#7d3515;
    --torch:#e0a63c;
    --parchment:#f2e3cb;
    --muted:#b79a78;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  body{
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2.5rem 1.5rem;
    background:
      radial-gradient(ellipse 70% 55% at 50% 22%, #8a4018 0%, rgba(138,64,24,0) 62%),
      linear-gradient(180deg, var(--umber) 0%, var(--stone) 70%);
    background-color:var(--stone);
    color:var(--parchment);
    font-family:Spectral, Georgia, "Times New Roman", serif;
    font-size:17px;
    line-height:1.6;
    text-align:center;
  }

  main{max-width:34rem;width:100%}

  .crest{
    width:104px;height:104px;
    margin:0 auto 1.75rem;
    border-radius:23%;
    background:
      radial-gradient(circle at 50% 38%, #c9731f 0%, #5e2a10 58%, #2a1206 100%);
    border:1px solid rgba(224,166,60,.38);
    box-shadow:0 0 56px rgba(224,166,60,.3), inset 0 1px 0 rgba(255,214,150,.22);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .crest svg{width:46px;height:46px;opacity:.92}

  h1{
    font-size:clamp(2.1rem, 7vw, 3rem);
    font-weight:600;
    letter-spacing:.012em;
    line-height:1.1;
  }

  .tagline{
    margin:.85rem auto 0;
    max-width:27rem;
    color:var(--muted);
    font-style:italic;
    font-size:1.03rem;
  }

  .rule{
    width:84px;height:1px;
    margin:2.2rem auto;
    background:linear-gradient(90deg, transparent, rgba(224,166,60,.55), transparent);
  }

  .stores{
    display:flex;
    flex-wrap:wrap;
    gap:.9rem;
    justify-content:center;
  }

  .store{
    display:inline-flex;
    align-items:center;
    gap:.65rem;
    padding:.85rem 1.5rem;
    min-width:13.5rem;
    border-radius:7px;
    text-decoration:none;
    font-size:1.02rem;
    transition:transform .14s ease, background-color .14s ease, border-color .14s ease;
  }
  .store svg{width:21px;height:21px;flex:none}

  .store--ios{
    background:var(--torch);
    color:#241003;
    border:1px solid var(--torch);
    font-weight:600;
  }
  .store--ios:hover{background:#efb952;border-color:#efb952}

  .store--play{
    background:rgba(242,227,203,.05);
    color:var(--parchment);
    border:1px solid rgba(224,166,60,.4);
  }
  .store--play:hover{background:rgba(242,227,203,.1);border-color:rgba(224,166,60,.7)}

  .store:hover{transform:translateY(-1px)}
  .store:focus-visible{outline:2px solid var(--torch);outline-offset:3px}

  .note{
    margin-top:2.4rem;
    font-size:.88rem;
    color:#8a7158;
  }

  @media (prefers-reduced-motion: reduce){
    .store{transition:none}
    .store:hover{transform:none}
  }
</style>
</head>
<body>
<main>

  <div class="crest" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#f5dca8" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2.5 4 5.6v6.1c0 4.7 3.3 8.2 8 9.8 4.7-1.6 8-5.1 8-9.8V5.6z"/>
      <path d="M12 7.6v7.3M9 10.4h6"/>
    </svg>
  </div>

  <h1>Historium Arena</h1>

  <p class="tagline">
    Întrebări de cultură generală, curiozități din istorie și lupte în arenă.
    Gratuit, fără reclame.
  </p>

  <div class="rule" aria-hidden="true"></div>

  <div class="stores">
    <a class="store store--ios" href="https://apps.apple.com/app/id6800425743">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M16.4 12.7c0-2.4 2-3.6 2.1-3.6-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.6.9s-1.9-.8-3.1-.8c-1.6 0-3.1.9-3.9 2.4-1.7 2.9-.4 7.2 1.2 9.5.8 1.2 1.7 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8s1.9.8 3.1.8 2.1-1.2 2.9-2.3c.9-1.3 1.3-2.6 1.3-2.7-.1 0-2.6-1-2.6-3.9zM14.1 5.6c.7-.8 1.1-1.9 1-3-1 0-2.2.6-2.9 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.2-.6 2.9-1.4z"/>
      </svg>
      Descarcă pe iPhone
    </a>

    <a class="store store--play" href="https://play.google.com/store/apps/details?id=com.quizmedieval.quiz_medieval">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M3.6 1.8c-.3.3-.5.8-.5 1.4v17.6c0 .6.2 1.1.5 1.4l.1.1 9.9-9.9v-.2L3.7 1.8zM17.2 15.6l-3.3-3.3v-.2l3.3-3.3.1.1 3.9 2.2c1.1.6 1.1 1.7 0 2.3l-3.9 2.2zM17.3 15.7 13.9 12.3 3.6 22.6c.4.4 1 .4 1.7 0l12-6.9M17.3 8.3 5.3 1.4c-.7-.4-1.3-.4-1.7 0l10.3 10.3z"/>
      </svg>
      Descarcă pe Android
    </a>
  </div>

  <p class="note">Pe telefon ești dus automat în magazinul potrivit.</p>

</main>
</body>
</html>
